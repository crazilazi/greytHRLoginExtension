<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>greytHR Auto Login</title>
  <link href="/app/styles/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/app/styles/flatpickr.min.css">
  <link rel="stylesheet" href="/app/styles/app.css">
</head>

<body>
  <div class="container mt-3">
    <h4 class="mb-4">greytHR Auto Login Settings</h4>

    <!-- User Credentials -->
    <div class="mb-3">
      <label for="huha" class="form-label">greyTHR User ID</label>
      <input type="text" class="form-control" id="huha" placeholder="Enter your User ID">
    </div>
    <div class="mb-3">
      <label for="hahu" class="form-label">Password</label>
      <input type="password" class="form-control" id="hahu" placeholder="Enter your Password">
    </div>

    <!-- Login/Logout Time -->
    <div class="mb-3">
      <label for="loginTime" class="form-label">Login Time</label>
      <input type="text" class="form-control timepicker-ui-input" id="loginTime" placeholder="HH:MM">
    </div>
    <div class="mb-3">
      <label for="logOutTime" class="form-label">Logout Time</label>
      <input type="text" class="form-control timepicker-ui-input" id="logOutTime" placeholder="HH:MM">
    </div>

    <!-- Holidays -->
    <div class="mb-3">
      <label for="holidays" class="form-label">Holidays</label>
      <input type="text" class="form-control" id="holidays" placeholder="Select holidays">
    </div>

    <!-- Notification Settings -->
    <div class="mb-3">
      <h5>Notification Settings</h5>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="enableNotifications">
        <label class="form-check-label" for="enableNotifications">Enable Notifications</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="enableLogging">
        <label class="form-check-label" for="enableLogging">Enable Logging</label>
      </div>
    </div>

    <div class="mb-3">
      <h5>Advanced Settings</h5>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="autoLoginOnStartup">
        <label class="form-check-label" for="autoLoginOnStartup">Auto-login on browser startup</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="enableSessionExtension">
        <label class="form-check-label" for="enableSessionExtension">Enable session extension</label>
      </div>
      <div class="form-group mt-2">
        <label for="sessionExtensionTime">Session Extension Time (minutes)</label>
        <input type="number" class="form-control" id="sessionExtensionTime" min="1" max="120" value="30">
      </div>
    </div>

    <!-- Buttons -->
    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-secondary me-2" id="btnReset">Reset</button>
      <button type="button" class="btn btn-primary" id="btnSave">Save</button>
    </div>

    <!-- Notes -->
    <div class="mt-4 text-muted">
      <small>
        *** Note: Time should be in 24-hour format.<br>
        *** If you mess up the settings, click the "Reset" button.
      </small>
    </div>
  </div>

  <script src="app/libs/bootstrap.bundle.min.js"></script>
  <script src="app/libs/flatpickr.js"></script>
  <script src="app/app.js"></script>
</body>

</html>
